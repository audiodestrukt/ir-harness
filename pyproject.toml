[project]
name = "irharness"
version = "0.1.0"
description = "Round-trip audio measurement harness: sweeps, stepped sines and DI clips through any DUT (sim or hardware), aligned and compared."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "soundfile>=0.12", "matplotlib>=3.8"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
irh = "irharness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["irharness*"]
